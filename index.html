<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X O Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game">
      <div class="title"><span>X O</span> GAME ... CHOOSE MODE</div>

      <div class="modes">
        <button id="pvpBtn" onclick="setMode('pvp')">Player vs Player</button>

        <button id="aiBtn" onclick="setMode('ai')">Player vs AI</button>
      </div>

      <div class="square" id="item1" onclick="game(this.id)"></div>
      <div class="square" id="item2" onclick="game(this.id)"></div>
      <div class="square" id="item3" onclick="game(this.id)"></div>

      <div class="square" id="item4" onclick="game(this.id)"></div>
      <div class="square" id="item5" onclick="game(this.id)"></div>
      <div class="square" id="item6" onclick="game(this.id)"></div>

      <div class="square" id="item7" onclick="game(this.id)"></div>
      <div class="square" id="item8" onclick="game(this.id)"></div>
      <div class="square" id="item9" onclick="game(this.id)"></div>

      <div class="result" id="result">
        <div class="scoreBox">
          <div class="resultText">X</div>
          <div class="resultNumX">0</div>
        </div>

        <div class="scoreBox">
          <div class="resultText">Draw</div>
          <div class="resultNum">0</div>
        </div>

        <div class="scoreBox">
          <div class="resultText">O</div>
          <div class="resultNumO">0</div>
        </div>
      </div>
      <button class="restart" onclick="restartGame()">Restart Game</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
